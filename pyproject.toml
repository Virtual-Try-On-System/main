[project]
name = "vton"
version = "0.1.0"
description = "Anthropometric data-supported virtual try-on system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.1",
    "lpips>=0.1.4",
    "mlflow-skinny>=3.18.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "scikit-image>=0.26.0",
    "sqlalchemy>=2.1.9",
    "torch-fidelity>=0.4.0",
    "torchmetrics>=1.9.0",
]

[project.optional-dependencies]
cpu = ["torch==2.14.1", "numpy>=2"]
cu130 = ["torch==2.14.1", "numpy>=2"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m \"not real_weights\""
markers = [
    "real_weights: needs pretrained LPIPS/Inception weights (network on first use); skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
