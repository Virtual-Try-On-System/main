name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block images and model weights
        run: |
          if git ls-files | grep -iE '\.(jpe?g|png|webp|heic|bmp|tiff?|pt|pth|ckpt|safetensors)$'; then
            echo "Images and model weights must not be committed." >&2
            exit 1
          fi

      - name: Build test image
        run: docker compose build test

      - name: Lint
        run: docker compose run --rm test uv run --frozen ruff check .

      - name: Test
        run: docker compose run --rm test
